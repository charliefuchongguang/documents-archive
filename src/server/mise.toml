# .mise.toml 适用于 Express Node 后端项目
[tools]
# 锁定长期支持LTS版本，推荐20.x
node = "24.16.0"
# 可选：如果固定pnpm/yarn版本再开启，不写则用node自带npm
# pnpm = "9"

[env]
# npm 国内镜像
NPM_CONFIG_REGISTRY = "https://registry.npmmirror.com"
# Express 开发环境标识
NODE_ENV = "development"
# 服务监听端口
PORT = "3000"
# 数据库/缓存自定义变量示例
# DB_HOST = "127.0.0.1"
# REDIS_PORT = "6379"

# 自动读取项目 .env 文件（本地密钥、私有配置放这里，.gitignore）
_.file = ".env"

# 前置本地脚本目录，全局可用 nodemon/ts-node/eslint 等，无需npx
_.path = ["./node_modules/.bin"]

# 统一项目任务脚本，使用 mise run xxx 执行
[tasks]
# 安装全部依赖
install = "npm install"
# 开发热启动（搭配 nodemon）
dev = "nodemon app.js"
# 单次启动服务（生产/测试）
start = "node ./app.js"
# 停止占用端口的旧进程后启动（避免 EADDRINUSE）
restart = "bash -c 'fuser -k ${PORT:-3000}/tcp 2>/dev/null; sleep 1; exec node ./app.js'"
# 代码格式校验
lint = "eslint ./"
# 格式化代码
format = "prettier --write ./**/*.js"
# 清空 node_modules 重装依赖
reinstall = "rm -rf node_modules package-lock.json && npm install"
